name: trace-ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gen:fixtures
      - run: npm run build --workspace @trace/shared
      - run: npm run typecheck
      - run: npm run test
      - run: npm run scan:secrets
      - run: npm run build --workspace apps/web
      - run: node scripts/verify-evidence.mjs --evidence evidence/evidence-final.json

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ secrets.EXA_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gen:fixtures
      - run: npm run build --workspace @trace/shared
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config apps/web/playwright.config.ts
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
